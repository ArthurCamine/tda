name: Runtime RC

on:
  workflow_dispatch:
    inputs:
      family:
        description: Runtime family to stage
        required: true
        type: choice
        options:
          - whisper
          - qwen
      source_sha:
        description: Exact main SHA with a successful runtime build
        required: true
        type: string
  workflow_run:
    workflows: [Whisper Runtime, Qwen Runtime Package]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish-rc:
    name: publish immutable runtime RC
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Runtime archives are multi-GB. Fifteen minutes left a partial draft release
    # in production before the GitHub upload could finish. Keep enough headroom
    # for Actions artifact download + release upload on a slow GitHub edge.
    timeout-minutes: 60
    env:
      FAMILY: ${{ github.event_name == 'workflow_dispatch' && inputs.family || (github.event.workflow_run.name == 'Whisper Runtime' && 'whisper' || 'qwen') }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
      TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      TRIGGER_EVENT: ${{ github.event.workflow_run.event || '' }}
      TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
      TRIGGER_STATUS: ${{ github.event.workflow_run.status || '' }}
      TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve trusted source and trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::source_sha must be one lowercase 40-character SHA"; exit 1; }
          [[ "$FAMILY" == "whisper" || "$FAMILY" == "qwen" ]] || { echo "::error::Runtime family is invalid"; exit 1; }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Runtime RC must be dispatched from main"; exit 1; }
            MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            [[ "$MAIN_SHA" == "$SOURCE_SHA" ]] || { echo "::error::source_sha must equal current main ($MAIN_SHA)"; exit 1; }
          else
            [[ "$TRIGGER_STATUS" == "completed" && "$TRIGGER_CONCLUSION" == "success" ]] || { echo "::error::AUTO_RUNTIME_TRIGGER_NOT_SUCCESSFUL"; exit 1; }
            [[ "$TRIGGER_EVENT" == "push" && "$TRIGGER_BRANCH" == "main" ]] || { echo "::error::AUTO_RUNTIME_TRIGGER_NOT_MAIN_PUSH"; exit 1; }
            [[ "$TRIGGER_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::AUTO_RUNTIME_TRIGGER_RUN_INVALID"; exit 1; }
            if [[ "$FAMILY" == "whisper" ]]; then
              [[ "$TRIGGER_WORKFLOW" == "Whisper Runtime" ]] || { echo "::error::AUTO_RUNTIME_TRIGGER_FAMILY_MISMATCH"; exit 1; }
            else
              [[ "$TRIGGER_WORKFLOW" == "Qwen Runtime Package" ]] || { echo "::error::AUTO_RUNTIME_TRIGGER_FAMILY_MISMATCH"; exit 1; }
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact source and safe automatic ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo "::error::RUNTIME_RC_SOURCE_CHECKOUT_MISMATCH"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main || { echo "::error::AUTO_RUNTIME_SOURCE_NOT_MAIN_ANCESTOR"; exit 1; }
            if ! git diff --quiet "$SOURCE_SHA" origin/main -- \
              local-companion \
              .github/workflows/whisper-runtime.yml \
              .github/workflows/qwen-runtime.yml \
              .github/workflows/qwen-runtime-package.yml; then
              echo "::error::AUTO_RUNTIME_CONTRACT_DRIFT"
              exit 1
            fi
          fi

      - name: Resolve exact successful runtime artifact
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$FAMILY" == "whisper" ]]; then
            WORKFLOW="whisper-runtime.yml"
            WORKFLOW_NAME="Whisper Runtime"
            WORKFLOW_PATH=".github/workflows/whisper-runtime.yml"
            ARTIFACT="TDAWhisperRuntime-windows-x64"
          else
            WORKFLOW="qwen-runtime-package.yml"
            WORKFLOW_NAME="Qwen Runtime Package"
            WORKFLOW_PATH=".github/workflows/qwen-runtime-package.yml"
            ARTIFACT="TDAQwenRuntimeBundle-windows-x64"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$TRIGGER_RUN_ID"
          else
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --branch main --commit "$SOURCE_SHA" --status success --limit 50 \
              --json databaseId,headSha,status,conclusion,createdAt > runtime-runs.json
            RUN_ID="$(python - <<'PY'
          import json, os
          source = os.environ['SOURCE_SHA']
          rows = json.load(open('runtime-runs.json', encoding='utf-8'))
          rows = [r for r in rows if r.get('headSha') == source and r.get('status') == 'completed' and r.get('conclusion') == 'success']
          if not rows:
              raise SystemExit('NO_SUCCESSFUL_RUNTIME_RUN_FOR_SOURCE')
          rows.sort(key=lambda r: (r.get('createdAt') or '', int(r.get('databaseId') or 0)))
          print(rows[-1]['databaseId'])
          PY
            )"
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > runtime-run.json
          RUN_ID="$RUN_ID" WORKFLOW_NAME="$WORKFLOW_NAME" WORKFLOW_PATH="$WORKFLOW_PATH" python - <<'PY'
          import json, os
          from datetime import datetime

          value = json.load(open('runtime-run.json', encoding='utf-8'))
          checks = {
              'name': os.environ['WORKFLOW_NAME'],
              'path': os.environ['WORKFLOW_PATH'],
              'head_sha': os.environ['SOURCE_SHA'],
              'head_branch': 'main',
              'event': 'push',
              'status': 'completed',
              'conclusion': 'success',
          }
          for key, expected in checks.items():
              if value.get(key) != expected:
                  raise SystemExit(f'RUNTIME_TRIGGER_IDENTITY_MISMATCH:{key}')
          if str(value.get('id')) != os.environ['RUN_ID']:
              raise SystemExit('RUNTIME_TRIGGER_IDENTITY_MISMATCH:id')
          if os.environ.get('TRIGGER_RUN_ID') and os.environ.get('GITHUB_EVENT_NAME') == 'workflow_run':
              if str(value.get('id')) != os.environ['TRIGGER_RUN_ID']:
                  raise SystemExit('AUTO_RUNTIME_TRIGGER_IDENTITY_MISMATCH:id')
          attempt = value.get('run_attempt')
          started = value.get('run_started_at')
          if not isinstance(attempt, int) or isinstance(attempt, bool) or attempt < 1:
              raise SystemExit('RUNTIME_TRIGGER_ATTEMPT_INVALID')
          if not isinstance(started, str):
              raise SystemExit('RUNTIME_TRIGGER_STARTED_AT_INVALID')
          try:
              datetime.fromisoformat(started.replace('Z', '+00:00'))
          except ValueError as exc:
              raise SystemExit('RUNTIME_TRIGGER_STARTED_AT_INVALID') from exc
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > runtime-artifacts.json
          ARTIFACT_ID="$(ARTIFACT_NAME="$ARTIFACT" python - <<'PY'
          import json, os
          from datetime import datetime

          run = json.load(open('runtime-run.json', encoding='utf-8'))
          value = json.load(open('runtime-artifacts.json', encoding='utf-8'))
          expected = os.environ['ARTIFACT_NAME']
          started = datetime.fromisoformat(run['run_started_at'].replace('Z', '+00:00'))
          rows = []
          for item in value.get('artifacts', []):
              if item.get('name') != expected or item.get('expired') is not False:
                  continue
              created_raw = item.get('created_at')
              if not isinstance(created_raw, str):
                  continue
              try:
                  created = datetime.fromisoformat(created_raw.replace('Z', '+00:00'))
              except ValueError:
                  continue
              workflow_run = item.get('workflow_run') if isinstance(item.get('workflow_run'), dict) else {}
              if str(workflow_run.get('id')) != str(run['id']) or workflow_run.get('head_sha') != os.environ['SOURCE_SHA']:
                  continue
              if created >= started:
                  rows.append(item)
          if len(rows) != 1:
              raise SystemExit(f'RUNTIME_ARTIFACT_ATTEMPT_COUNT_INVALID:{expected}:{len(rows)}')
          artifact_id = rows[0].get('id')
          if not isinstance(artifact_id, int) or isinstance(artifact_id, bool) or artifact_id < 1:
              raise SystemExit('RUNTIME_ARTIFACT_ID_INVALID')
          print(artifact_id)
          PY
          )"

          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact validated runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist runtime-artifact.zip
          mkdir -p dist
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ steps.runtime.outputs.artifact_id }}/zip" > runtime-artifact.zip
          python - <<'PY'
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive_path = Path('runtime-artifact.zip')
          if not archive_path.is_file() or archive_path.stat().st_size <= 0:
              raise SystemExit('RUNTIME_ACTIONS_ARTIFACT_DOWNLOAD_INVALID')
          target = Path('dist').resolve()
          with zipfile.ZipFile(archive_path, 'r') as archive:
              infos = archive.infolist()
              if not infos or len(infos) > 512:
                  raise SystemExit('RUNTIME_ACTIONS_ARTIFACT_ENTRY_LIMIT')
              seen = set()
              total = 0
              for info in infos:
                  if info.is_dir():
                      continue
                  raw = info.filename.replace('\\', '/')
                  path = PurePosixPath(raw)
                  if not raw or raw.startswith('/') or path.is_absolute() or any(part in ('', '.', '..') for part in path.parts):
                      raise SystemExit('RUNTIME_ACTIONS_ARTIFACT_PATH_INVALID')
                  key = path.as_posix().casefold()
                  if key in seen:
                      raise SystemExit('RUNTIME_ACTIONS_ARTIFACT_DUPLICATE')
                  seen.add(key)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if mode and stat.S_ISLNK(mode):
                      raise SystemExit('RUNTIME_ACTIONS_ARTIFACT_SYMLINK')
                  if info.file_size < 0:
                      raise SystemExit('RUNTIME_ACTIONS_ARTIFACT_SIZE_INVALID')
                  total += info.file_size
                  if total > 12 * 1024**3:
                      raise SystemExit('RUNTIME_ACTIONS_ARTIFACT_SIZE_LIMIT')
              archive.extractall(target)
          PY
          rm -f runtime-artifact.zip

      - name: Build deterministic candidate manifest
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          RC_TAG="$(PYTHONPATH=local-companion python -m tda_companion.runtime_release_evidence create-candidate \
            --family "$FAMILY" --assets-root dist --source-sha "$SOURCE_SHA" \
            --source-tree-sha "${{ steps.runtime.outputs.tree_sha }}" --workflow-run-id "${{ steps.runtime.outputs.run_id }}" \
            --output dist/TDARuntime-candidate.json)"
          [[ "$RC_TAG" =~ ^companion-(whisper|qwen)-runtime-rc-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]{12}$ ]] || exit 1
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"

      - name: Reuse verified runtime digests for provenance subjects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          candidate = json.loads(Path("dist/TDARuntime-candidate.json").read_text(encoding="utf-8"))
          assets = candidate.get("assets")
          if not isinstance(assets, list) or not assets:
              raise SystemExit("RUNTIME_ATTESTATION_ASSETS_INVALID")
          lines = []
          for asset in assets:
              name = asset.get("name") if isinstance(asset, dict) else None
              digest = asset.get("sha256") if isinstance(asset, dict) else None
              if (
                  not isinstance(name, str)
                  or Path(name).name != name
                  or not isinstance(digest, str)
                  or len(digest) != 64
              ):
                  raise SystemExit("RUNTIME_ATTESTATION_ASSET_INVALID")
              lines.append(f"{digest}  {name}")
          Path("dist/TDARuntime-candidate-checksums.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="ascii",
          )
          PY

      - name: Attest exact runtime asset digests without re-hashing multi-GB archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/TDARuntime-candidate-checksums.txt

      - name: Attest runtime candidate manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/TDARuntime-candidate.json

      - name: Publish or verify immutable prerelease
        shell: bash
        env:
          RC_TAG: ${{ steps.candidate.outputs.rc_tag }}
        run: |
          set -euo pipefail

          # gh release create stages a draft while uploading. A cancelled job can
          # therefore leave an incomplete draft with the final tag name but no
          # Git ref. It is safe to discard only that unpublished draft when its
          # target is the exact source being retried; published releases remain
          # immutable and are never rewritten.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > rc-existing-releases.json
          python - <<'PY' > rc-existing-state.txt
          import json, os
          rows = [
              item for item in json.load(open('rc-existing-releases.json', encoding='utf-8'))
              if item.get('tag_name') == os.environ['RC_TAG']
          ]
          if len(rows) > 1:
              raise SystemExit('RC_RELEASE_DUPLICATE_STATE')
          if not rows:
              print('missing')
          else:
              row = rows[0]
              release_id = row.get('id')
              if not isinstance(release_id, int) or isinstance(release_id, bool):
                  raise SystemExit('RC_RELEASE_ID_INVALID')
              target = row.get('target_commitish')
              if target != os.environ['SOURCE_SHA']:
                  raise SystemExit('RC_RELEASE_TARGET_MISMATCH')
              if row.get('draft') is True:
                  print(f'draft:{release_id}')
              elif row.get('draft') is False and row.get('prerelease') is True:
                  print(f'published:{release_id}')
              else:
                  raise SystemExit('RC_RELEASE_STATE_INVALID')
          PY
          RC_STATE="$(cat rc-existing-state.txt)"
          if [[ "$RC_STATE" == draft:* ]]; then
            DRAFT_ID="${RC_STATE#draft:}"
            echo "Removing incomplete retryable draft release $DRAFT_ID for $RC_TAG"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
            RC_STATE="missing"
          fi

          if [[ "$RC_STATE" == published:* ]]; then
            rm -rf rc-check && mkdir rc-check
            gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish > rc-release.json
            python - <<'PY'
          import json, os
          value = json.load(open('rc-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['RC_TAG'] or value.get('isDraft') is not False or value.get('isPrerelease') is not True:
              raise SystemExit('RC_RELEASE_STATE_INVALID')
          if value.get('targetCommitish') != os.environ['SOURCE_SHA']:
              raise SystemExit('RC_RELEASE_TARGET_MISMATCH')
          PY
            gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir rc-check
            cmp -s dist/TDARuntime-candidate.json rc-check/TDARuntime-candidate.json || { echo "::error::Existing RC manifest differs"; exit 1; }
            PYTHONPATH=local-companion python - <<'PY'
          import json
          from pathlib import Path
          from tda_companion.runtime_release_evidence import verify_candidate_assets
          candidate = json.loads(Path('rc-check/TDARuntime-candidate.json').read_text(encoding='utf-8'))
          verify_candidate_assets(candidate, Path('rc-check'))
          PY
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$RC_TAG" >/dev/null 2>&1; then
              echo "::error::RC tag exists without a release"; exit 1
            fi
            python - <<'PY' > asset-list.txt
          import json
          value = json.load(open('dist/TDARuntime-candidate.json', encoding='utf-8'))
          for item in value['assets']:
              print('dist/' + item['name'])
          PY
            mapfile -t ASSETS < asset-list.txt
            cat > release-notes.md <<EOF
          Candidato imutável do runtime ${FAMILY} para aceite físico na GPU real.

          - Source SHA: ${SOURCE_SHA}
          - Source tree SHA: ${{ steps.runtime.outputs.tree_sha }}
          - Runtime workflow run: ${{ steps.runtime.outputs.run_id }}
          - Canal: RC / prerelease
          - Stable exige receipt físico ligado ao mesmo runtime_archive_sha256 e promove este mesmo release sem rebuild.
          EOF
            gh release create "$RC_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease \
              --title "TDA ${FAMILY} runtime RC ${SOURCE_SHA:0:12}" --notes-file release-notes.md \
              dist/TDARuntime-candidate.json "${ASSETS[@]}"
          fi

      - name: Verify final RC identity
        shell: bash
        env:
          RC_TAG: ${{ steps.candidate.outputs.rc_tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RC_TAG:refs/tags/$RC_TAG"
          [[ "$(git rev-list -n 1 "$RC_TAG")" == "$SOURCE_SHA" ]] || { echo "::error::RC tag target mismatch"; exit 1; }
          echo "RUNTIME_RC_READY family=$FAMILY tag=$RC_TAG source=$SOURCE_SHA run=${{ steps.runtime.outputs.run_id }}"
