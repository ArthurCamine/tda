name: Promotion Policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-source:
    name: promotion-source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Accept direct pull requests to main during cutover
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_BRANCH" != "main" ]]; then
            echo "::error::Expected PR target main, received ${HEAD_BRANCH} -> ${BASE_BRANCH}."
            exit 1
          fi
          echo "MAIN_PR_SOURCE_OK ${HEAD_BRANCH} -> ${BASE_BRANCH}"
          echo "promotion-source is transitional and will be removed after main-only cutover."
