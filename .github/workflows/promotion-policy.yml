name: Promotion Compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-source:
    name: promotion-source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep legacy required context green during main-only cutover
        shell: bash
        run: |
          set -euo pipefail
          echo "promotion-source is a temporary compatibility context."
          echo "Production provenance is enforced at release time by requiring an actual merged PR into main."
