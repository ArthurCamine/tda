name: Qwen Runtime Candidate

on:
  pull_request:
    paths:
      - '.github/workflows/qwen-runtime.yml'
      - 'local-companion/runtime/qwen-windows-x64.json'
      - 'local-companion/packaging/build_qwen_runtime_plan.py'
      - 'local-companion/packaging/qwen_runtime_probe.py'
      - 'local-companion/packaging/qwen_runtime_entry.py'
      - 'local-companion/tda_companion/asr_models.py'
      - 'local-companion/tda_companion/asr_qwen.py'
      - 'local-companion/tda_companion/asr_checkpoints.py'
      - 'local-companion/tda_companion/asr_timeline.py'
      - 'local-companion/tda_companion/engine_metrics.py'
      - 'local-companion/tda_companion/execution_device.py'
      - 'local-companion/tda_companion/craig.py'
      - 'local-companion/tda_companion/craig_runtime.py'
      - 'local-companion/tda_companion/flac_metadata.py'
      - 'local-companion/tda_companion/qwen_acceptance_window.py'
      - 'local-companion/tda_companion/transcript.py'
      - 'local-companion/tda_companion/transcription_runs.py'
      - 'local-companion/tda_companion/atomic_storage.py'
      - 'local-companion/tda_companion/attempt_fence.py'
      - 'local-companion/tda_companion/asr_qwen_strict.py'
      - 'local-companion/tda_companion/qwen_checkpoint_compat.py'
      - 'local-companion/tda_companion/qwen_runtime.py'
      - 'local-companion/tda_companion/asr_worker.py'
      - 'local-companion/tda_companion/worker_supervisor.py'
      - 'local-companion/tests/test_qwen_runtime.py'
      - 'local-companion/tests/test_qwen_worker_routing.py'
  push:
    branches: [main, Preview]
    paths:
      - '.github/workflows/qwen-runtime.yml'
      - 'local-companion/runtime/qwen-windows-x64.json'
      - 'local-companion/packaging/build_qwen_runtime_plan.py'
      - 'local-companion/packaging/qwen_runtime_probe.py'
      - 'local-companion/packaging/qwen_runtime_entry.py'
      - 'local-companion/tda_companion/asr_models.py'
      - 'local-companion/tda_companion/asr_qwen.py'
      - 'local-companion/tda_companion/asr_checkpoints.py'
      - 'local-companion/tda_companion/asr_timeline.py'
      - 'local-companion/tda_companion/engine_metrics.py'
      - 'local-companion/tda_companion/execution_device.py'
      - 'local-companion/tda_companion/craig.py'
      - 'local-companion/tda_companion/craig_runtime.py'
      - 'local-companion/tda_companion/flac_metadata.py'
      - 'local-companion/tda_companion/qwen_acceptance_window.py'
      - 'local-companion/tda_companion/transcript.py'
      - 'local-companion/tda_companion/transcription_runs.py'
      - 'local-companion/tda_companion/atomic_storage.py'
      - 'local-companion/tda_companion/attempt_fence.py'
      - 'local-companion/tda_companion/asr_qwen_strict.py'
      - 'local-companion/tda_companion/qwen_checkpoint_compat.py'
      - 'local-companion/tda_companion/qwen_runtime.py'
      - 'local-companion/tda_companion/asr_worker.py'
      - 'local-companion/tda_companion/worker_supervisor.py'

concurrency:
  group: qwen-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-plan:
    name: qwen-runtime-plan-windows-x64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.18'
      - name: Resolve and probe isolated Qwen runtime candidate
        shell: pwsh
        run: python local-companion/packaging/build_qwen_runtime_plan.py
      - name: Upload resolved runtime plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDAQwenRuntimePlan-windows-x64
          path: local-companion/out/qwen-runtime/TDAQwenRuntimePlan-*-windows-x64.json
          if-no-files-found: error
          retention-days: 7
