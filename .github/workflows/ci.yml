name: CI

on:
  push:
    branches: [main, Preview]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

  # Mantido nesta fase por compatibilidade com a branch protection atual.
  # A Fase 3 tornará este job condicional a mudanças de banco/data layer.
  transcript-import-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: pnpm exec vitest run src/features/transcript-sync/database.test.ts
        env:
          TDA_SYNTHETIC_POSTGRES: "1"
      - run: python tools/world-layout-db.py
      - run: python tools/world-entity-media-db.py

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Migration safety policy
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF"
            node tools/ci/check-migrations.mjs "origin/${GITHUB_BASE_REF}...HEAD"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            node tools/ci/check-migrations.mjs "${BEFORE_SHA}...HEAD"
          else
            node tools/ci/check-migrations.mjs
          fi

      - run: python -m unittest discover -s tools/media -p test_lore_svg.py
      - name: Typecheck, lint, unit and repository checks
        run: pnpm check
      - name: Build application
        run: pnpm build

  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs:
      - workflow-contract
      - validate
    steps:
      - name: Require fast CI contract
        env:
          WORKFLOW_CONTRACT_RESULT: ${{ needs.workflow-contract.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WORKFLOW_CONTRACT_RESULT" = "success"
          test "$VALIDATE_RESULT" = "success"
