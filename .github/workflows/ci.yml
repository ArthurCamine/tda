name: CI

on:
  push:
    branches: [main, Preview]
  pull_request:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: classify-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.classify.outputs.web }}
      db: ${{ steps.classify.outputs.db }}
      companion: ${{ steps.classify.outputs.companion }}
      media: ${{ steps.classify.outputs.media }}
      files_json: ${{ steps.classify.outputs.files_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF"
            RANGE="origin/${GITHUB_BASE_REF}...${PR_HEAD_SHA}"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            RANGE="${BEFORE_SHA}...${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA}^...${GITHUB_SHA}"
          fi
          node tools/ci/classify-changes.mjs "$RANGE"

  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Validate change and Production release classifiers
        run: >-
          node --test
          tools/ci/classify-changes.test.mjs
          tools/ci/production-release-plan.test.mjs

  transcript-import-postgres:
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: pnpm exec vitest run src/features/transcript-sync/database.test.ts
        env:
          TDA_SYNTHETIC_POSTGRES: "1"
      - run: python tools/world-layout-db.py
      - run: python tools/world-entity-media-db.py

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Migration safety policy
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF"
            node tools/ci/check-migrations.mjs "origin/${GITHUB_BASE_REF}...HEAD"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            node tools/ci/check-migrations.mjs "${BEFORE_SHA}...HEAD"
          else
            node tools/ci/check-migrations.mjs
          fi

      - run: python -m unittest discover -s tools/media -p test_lore_svg.py
      - name: Typecheck, lint, unit and repository checks
        run: pnpm check
      - name: Build application
        run: pnpm build

  companion-domain:
    name: companion-domain
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.companion == 'true' }}
    uses: ./.github/workflows/companion.yml
    with:
      source_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  media-domain:
    name: media-domain
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.media == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate media manifests and publication contracts locally
        run: |
          pnpm media:validate
          node --test \
            tools/media/recovery.test.mjs \
            tools/media/publication-contract.test.mjs \
            tools/media/lore-assets.test.mjs \
            tools/media/pipeline.test.mjs \
            tools/media/verify-public.test.mjs \
            tools/world-entity-media-r2-policy.test.mjs

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs:
      - classify-changes
      - workflow-contract
      - validate
      - transcript-import-postgres
      - companion-domain
      - media-domain
    steps:
      - name: Require fast and relevant domain contracts
        env:
          CLASSIFIER_RESULT: ${{ needs.classify-changes.result }}
          WORKFLOW_CONTRACT_RESULT: ${{ needs.workflow-contract.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DB_RELEVANT: ${{ needs.classify-changes.outputs.db }}
          DB_RESULT: ${{ needs.transcript-import-postgres.result }}
          COMPANION_RELEVANT: ${{ needs.classify-changes.outputs.companion }}
          COMPANION_RESULT: ${{ needs.companion-domain.result }}
          MEDIA_RELEVANT: ${{ needs.classify-changes.outputs.media }}
          MEDIA_RESULT: ${{ needs.media-domain.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFIER_RESULT" = "success"
          test "$WORKFLOW_CONTRACT_RESULT" = "success"
          test "$VALIDATE_RESULT" = "success"

          if [[ "$DB_RELEVANT" == "true" ]]; then
            test "$DB_RESULT" = "success"
          else
            test "$DB_RESULT" = "skipped"
          fi

          if [[ "$COMPANION_RELEVANT" == "true" ]]; then
            test "$COMPANION_RESULT" = "success"
          else
            test "$COMPANION_RESULT" = "skipped"
          fi

          if [[ "$MEDIA_RELEVANT" == "true" ]]; then
            test "$MEDIA_RESULT" = "success"
          else
            test "$MEDIA_RESULT" = "skipped"
          fi

  preview-deployment:
    name: preview-deployment
    needs: ci-gate
    if: ${{ always() && github.event_name == 'pull_request' && needs.ci-gate.result == 'success' }}
    uses: ./.github/workflows/deploy-preview.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs:
      - ci-gate
      - preview-deployment
    steps:
      - name: Require CI gate and PR Preview when applicable
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
          PREVIEW_RESULT: ${{ needs.preview-deployment.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CI_GATE_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$PREVIEW_RESULT" = "success"
          else
            test "$PREVIEW_RESULT" = "skipped"
          fi
