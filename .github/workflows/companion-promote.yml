name: Companion Promote Stable

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Immutable RC tag to promote (companion-rc-vX.Y.Z-<source12>)
        required: true
        type: string
      confirmation:
        description: Type PROMOTE to authorize the final channel switch
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: verify receipt and promote exact RC bytes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Stable promotion must be dispatched from main"; exit 1; }
          [[ "$CONFIRMATION" == "PROMOTE" ]] || { echo "::error::confirmation must be exactly PROMOTE"; exit 1; }
          [[ "$RC_TAG" =~ ^companion-rc-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]{12}$ ]] || { echo "::error::Invalid RC tag shape"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact receipt path for this RC
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT_PATH="docs/companion/acceptance/${RC_TAG}.json"
          [[ -f "$RECEIPT_PATH" ]] || { echo "::error::Missing physical acceptance receipt at $RECEIPT_PATH"; exit 1; }
          echo "path=$RECEIPT_PATH" >> "$GITHUB_OUTPUT"

      - name: Require active prerelease RC
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish > rc-release.json
          python - <<'PY'
          import json, os
          value = json.load(open('rc-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['RC_TAG'] or value.get('isDraft') is not False or value.get('isPrerelease') is not True:
              raise SystemExit('RC_RELEASE_STATE_INVALID')
          PY

      - name: Download RC assets without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-assets
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir rc-assets
          for file in TDACompanion-candidate.json TDACompanion-x64.msi TDACompanion-x64.msi.sha256 TDACompanion-payload-manifest.json; do
            test -f "rc-assets/$file"
          done

      - name: Verify candidate bytes and physical receipt v2
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared
          cp "${{ steps.receipt.outputs.path }}" prepared/TDACompanion-acceptance.json
          STABLE_TAG="$(PYTHONPATH=local-companion python -m tda_companion.release_evidence verify-promotion \
            --candidate-manifest rc-assets/TDACompanion-candidate.json \
            --acceptance-receipt prepared/TDACompanion-acceptance.json \
            --assets-root rc-assets \
            --output prepared/TDACompanion-promotion.json)"
          PYTHONPATH=local-companion python -m tda_companion.promotion_payload_verify \
            --candidate-manifest rc-assets/TDACompanion-candidate.json \
            --acceptance-receipt prepared/TDACompanion-acceptance.json \
            --assets-root rc-assets
          [[ "$STABLE_TAG" =~ ^companion-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open('prepared/TDACompanion-promotion.json', encoding='utf-8'))
          print('stable_tag=' + value['stable_tag'])
          print('source_sha=' + value['source_sha'])
          print('source_tree_sha=' + value['source_tree_sha'])
          print('version=' + value['version'])
          if value['candidate_tag'] != '${{ inputs.rc_tag }}':
              raise SystemExit('RC_EVIDENCE_TAG_MISMATCH')
          PY

      - name: Require current main to contain identical Companion/release content
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          if ! git diff --quiet "$SOURCE_SHA" HEAD -- local-companion \
            .github/workflows/companion.yml \
            .github/workflows/companion-rc.yml \
            .github/workflows/companion-promote.yml \
            .github/workflows/companion-dependency-freshness.yml; then
            echo "::error::Companion or release workflow content differs from the physically tested source; create a new RC"
            git diff --name-only "$SOURCE_SHA" HEAD -- local-companion .github/workflows/companion*.yml || true
            exit 1
          fi

      - name: Verify RC tag and release target resolve to tested source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          git fetch --force origin "refs/tags/$RC_TAG:refs/tags/$RC_TAG"
          [[ "$(git rev-list -n 1 "$RC_TAG")" == "$SOURCE_SHA" ]] || { echo "::error::RC tag target mismatch"; exit 1; }
          TARGET="$(python -c "import json; print(json.load(open('rc-release.json')).get('targetCommitish') or '')")"
          [[ "$TARGET" == "$SOURCE_SHA" ]] || { echo "::error::RC release target mismatch"; exit 1; }

      - name: Require stable identity to be unused
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          ! gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "::error::Stable release already exists"; exit 1; }
          ! git ls-remote --exit-code --tags origin "refs/tags/$STABLE_TAG" >/dev/null 2>&1 || { echo "::error::Stable tag already exists"; exit 1; }

      - name: Attach audit evidence idempotently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-current
          for NAME in TDACompanion-acceptance.json TDACompanion-promotion.json; do
            if gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir evidence-current >/dev/null 2>&1; then
              cmp -s "evidence-current/$NAME" "prepared/$NAME" || { echo "::error::Existing RC evidence $NAME differs"; exit 1; }
            else
              gh release upload "$RC_TAG" --repo "$GITHUB_REPOSITORY" "prepared/$NAME"
            fi
          done

      - name: Re-download evidence before channel switch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence-check && mkdir evidence-check
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'TDACompanion-acceptance.json' --pattern 'TDACompanion-promotion.json' --dir evidence-check
          cmp -s evidence-check/TDACompanion-acceptance.json prepared/TDACompanion-acceptance.json
          cmp -s evidence-check/TDACompanion-promotion.json prepared/TDACompanion-promotion.json

      - name: Promote the same release object and assets to stable
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          VERSION="${{ steps.evidence.outputs.version }}"
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          MSI_SHA="$(python -c "import json; print(json.load(open('prepared/TDACompanion-promotion.json'))['assets']['msi']['sha256'])")"
          PAYLOAD_SHA="$(python -c "import json; print(json.load(open('prepared/TDACompanion-promotion.json'))['assets']['payload_manifest']['sha256'])")"
          RECEIPT_SHA="$(sha256sum prepared/TDACompanion-acceptance.json | awk '{print $1}')"
          cat > stable-notes.md <<EOF
          Instalador oficial do TDA Companion v${VERSION} para Windows x64.

          Promoção do candidato físico ${RC_TAG}; binários não foram recompilados nem reenviados.

          - Source SHA testado: ${SOURCE_SHA}
          - Source tree SHA: ${{ steps.evidence.outputs.source_tree_sha }}
          - MSI SHA-256: ${MSI_SHA}
          - Payload manifest SHA-256: ${PAYLOAD_SHA}
          - Acceptance receipt SHA-256: ${RECEIPT_SHA}
          EOF
          gh release edit "$RC_TAG" --repo "$GITHUB_REPOSITORY" --tag "$STABLE_TAG" --target "$SOURCE_SHA" \
            --title "TDA Companion v${VERSION}" --notes-file stable-notes.md --prerelease=false --latest

      - name: Verify stable postconditions from fresh downloads
        shell: bash
        env:
          STABLE_TAG: ${{ steps.evidence.outputs.stable_tag }}
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish > stable-release.json
          python - <<'PY'
          import json, os
          value = json.load(open('stable-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['STABLE_TAG'] or value.get('isDraft') is not False or value.get('isPrerelease') is not False:
              raise SystemExit('STABLE_RELEASE_STATE_INVALID')
          if value.get('targetCommitish') != os.environ['SOURCE_SHA']:
              raise SystemExit('STABLE_RELEASE_TARGET_MISMATCH')
          PY
          rm -rf stable-check && mkdir stable-check
          gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --dir stable-check
          PYTHONPATH=local-companion python -m tda_companion.release_evidence verify-promotion \
            --candidate-manifest stable-check/TDACompanion-candidate.json \
            --acceptance-receipt stable-check/TDACompanion-acceptance.json \
            --assets-root stable-check --output stable-check/post-promotion.json >/dev/null
          PYTHONPATH=local-companion python -m tda_companion.promotion_payload_verify \
            --candidate-manifest stable-check/TDACompanion-candidate.json \
            --acceptance-receipt stable-check/TDACompanion-acceptance.json \
            --assets-root stable-check
          cmp -s stable-check/TDACompanion-promotion.json stable-check/post-promotion.json
          git fetch --force origin "refs/tags/$STABLE_TAG:refs/tags/$STABLE_TAG"
          [[ "$(git rev-list -n 1 "$STABLE_TAG")" == "$SOURCE_SHA" ]] || { echo "::error::Stable tag target mismatch"; exit 1; }
          echo "STABLE_PROMOTION_VERIFIED tag=$STABLE_TAG source=$SOURCE_SHA"
