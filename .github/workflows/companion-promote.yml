name: Companion Promote Stable

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Immutable RC tag to promote (companion-rc-vX.Y.Z-<source12>)
        required: true
        type: string
      confirmation:
        description: Type PROMOTE to authorize the final channel switch
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: verify receipt and promote exact RC bytes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Stable promotion must be dispatched from main"
            exit 1
          fi
          if [[ "$CONFIRMATION" != "PROMOTE" ]]; then
            echo "::error::confirmation must be exactly PROMOTE"
            exit 1
          fi
          if [[ ! "$RC_TAG" =~ ^companion-rc-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]{12}$ ]]; then
            echo "::error::Invalid RC tag shape"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact receipt path for this RC
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT_PATH="docs/companion/acceptance/${RC_TAG}.json"
          if [[ ! -f "$RECEIPT_PATH" ]]; then
            echo "::error::Missing physical acceptance receipt at $RECEIPT_PATH"
            exit 1
          fi
          echo "path=$RECEIPT_PATH" >> "$GITHUB_OUTPUT"

      - name: Require an unpublished prerelease RC
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish > rc-release.json; then
            echo "::error::RC release $RC_TAG does not exist"
            exit 1
          fi
          python - <<'PY'
          import json, os
          value = json.load(open('rc-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['RC_TAG']:
              raise SystemExit('RC_RELEASE_TAG_MISMATCH')
          if value.get('isDraft') is not False or value.get('isPrerelease') is not True:
              raise SystemExit('RC_RELEASE_IS_NOT_AN_ACTIVE_PRERELEASE')
          PY

      - name: Download RC assets without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-assets
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir rc-assets
          test -f rc-assets/TDACompanion-candidate.json
          test -f rc-assets/TDACompanion-x64.msi
          test -f rc-assets/TDACompanion-x64.msi.sha256

      - name: Verify candidate bytes and physical receipt
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared
          cp "${{ steps.receipt.outputs.path }}" prepared/TDACompanion-acceptance.json
          STABLE_TAG="$(PYTHONPATH=local-companion python -m tda_companion.release_evidence verify-promotion \
            --candidate-manifest rc-assets/TDACompanion-candidate.json \
            --acceptance-receipt prepared/TDACompanion-acceptance.json \
            --assets-root rc-assets \
            --output prepared/TDACompanion-promotion.json)"
          if [[ ! "$STABLE_TAG" =~ ^companion-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Promotion evidence returned an invalid stable tag"
            exit 1
          fi
          SOURCE_SHA="$(python - <<'PY'
          import json
          value = json.load(open('prepared/TDACompanion-promotion.json', encoding='utf-8'))
          print(value['source_sha'])
          PY
          )"
          VERSION="${STABLE_TAG#companion-v}"
          CANDIDATE_TAG="$(python - <<'PY'
          import json
          value = json.load(open('prepared/TDACompanion-promotion.json', encoding='utf-8'))
          print(value['candidate_tag'])
          PY
          )"
          if [[ "$CANDIDATE_TAG" != "$RC_TAG" ]]; then
            echo "::error::Receipt/candidate evidence belongs to $CANDIDATE_TAG, not $RC_TAG"
            exit 1
          fi
          echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require tested source to be safely contained in current main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          if ! git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Tested source SHA is not present in main history"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" HEAD; then
            echo "::error::Tested source SHA is not an ancestor of current main"
            exit 1
          fi
          if ! git diff --quiet "$SOURCE_SHA" HEAD -- .github/workflows; then
            echo "::error::Workflow files changed after the tested candidate; create and physically accept a new RC"
            exit 1
          fi
          if ! git diff --quiet "$SOURCE_SHA" HEAD -- local-companion; then
            echo "::error::Companion code changed after the tested candidate; create and physically accept a new RC"
            exit 1
          fi

      - name: Verify RC tag and release target resolve to the tested source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          git fetch --force origin "refs/tags/$RC_TAG:refs/tags/$RC_TAG"
          RESOLVED_SHA="$(git rev-list -n 1 "$RC_TAG")"
          if [[ "$RESOLVED_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::RC tag resolves to $RESOLVED_SHA instead of tested source $SOURCE_SHA"
            exit 1
          fi
          TARGET="$(python - <<'PY'
          import json
          value = json.load(open('rc-release.json', encoding='utf-8'))
          print(value.get('targetCommitish') or '')
          PY
          )"
          if [[ "$TARGET" != "$SOURCE_SHA" ]]; then
            echo "::error::RC release target is $TARGET instead of tested source $SOURCE_SHA"
            exit 1
          fi

      - name: Require stable identity to be unused
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Stable release $STABLE_TAG already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$STABLE_TAG" >/dev/null 2>&1; then
            echo "::error::Stable tag $STABLE_TAG already exists"
            exit 1
          fi

      - name: Attach audit evidence idempotently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-current
          for NAME in TDACompanion-acceptance.json TDACompanion-promotion.json; do
            if gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir evidence-current >/dev/null 2>&1; then
              if ! cmp -s "evidence-current/$NAME" "prepared/$NAME"; then
                echo "::error::Existing RC evidence asset $NAME differs from the verified local evidence"
                exit 1
              fi
              echo "Reusing identical evidence asset $NAME"
            else
              gh release upload "$RC_TAG" --repo "$GITHUB_REPOSITORY" "prepared/$NAME"
            fi
          done

      - name: Re-download evidence before channel switch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence-check
          mkdir -p evidence-check
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'TDACompanion-acceptance.json' \
            --pattern 'TDACompanion-promotion.json' \
            --dir evidence-check
          cmp -s evidence-check/TDACompanion-acceptance.json prepared/TDACompanion-acceptance.json
          cmp -s evidence-check/TDACompanion-promotion.json prepared/TDACompanion-promotion.json

      - name: Promote the same release object and assets to stable
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          VERSION="${{ steps.evidence.outputs.version }}"
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          MSI_SHA="$(python - <<'PY'
          import json
          value = json.load(open('prepared/TDACompanion-promotion.json', encoding='utf-8'))
          print(value['assets']['msi']['sha256'])
          PY
          )"
          RECEIPT_SHA="$(sha256sum prepared/TDACompanion-acceptance.json | awk '{print $1}')"
          cat > stable-notes.md <<EOF
          Instalador oficial do TDA Companion v${VERSION} para Windows x64.

          Esta release é a promoção do candidato físico ${RC_TAG}; os binários não foram recompilados nem reenviados.

          - Source SHA testado: ${SOURCE_SHA}
          - MSI SHA-256: ${MSI_SHA}
          - Acceptance receipt SHA-256: ${RECEIPT_SHA}
          - Instalação por usuário em %LOCALAPPDATA%\\TDA\\Companion.
          - Dados locais permanecem em %LOCALAPPDATA%\\TDA\\Data.
          EOF
          gh release edit "$RC_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$STABLE_TAG" \
            --target "$SOURCE_SHA" \
            --title "TDA Companion v${VERSION}" \
            --notes-file stable-notes.md \
            --prerelease=false \
            --latest

      - name: Verify stable postconditions from fresh downloads
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish > stable-release.json
          python - <<'PY'
          import json, os
          value = json.load(open('stable-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['STABLE_TAG']:
              raise SystemExit('STABLE_RELEASE_TAG_MISMATCH')
          if value.get('isDraft') is not False or value.get('isPrerelease') is not False:
              raise SystemExit('STABLE_RELEASE_STATE_INVALID')
          if value.get('targetCommitish') != os.environ['SOURCE_SHA']:
              raise SystemExit('STABLE_RELEASE_TARGET_MISMATCH')
          PY
          rm -rf stable-check
          mkdir -p stable-check
          gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --dir stable-check
          PYTHONPATH=local-companion python -m tda_companion.release_evidence verify-promotion \
            --candidate-manifest stable-check/TDACompanion-candidate.json \
            --acceptance-receipt stable-check/TDACompanion-acceptance.json \
            --assets-root stable-check \
            --output stable-check/post-promotion.json >/dev/null
          cmp -s stable-check/TDACompanion-promotion.json stable-check/post-promotion.json
          git fetch --force origin "refs/tags/$STABLE_TAG:refs/tags/$STABLE_TAG"
          RESOLVED_SHA="$(git rev-list -n 1 "$STABLE_TAG")"
          if [[ "$RESOLVED_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Stable tag resolves to $RESOLVED_SHA instead of tested source $SOURCE_SHA"
            exit 1
          fi
          echo "STABLE_PROMOTION_VERIFIED tag=$STABLE_TAG source=$SOURCE_SHA"
        env:
          STABLE_TAG: ${{ steps.evidence.outputs.stable_tag }}
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
