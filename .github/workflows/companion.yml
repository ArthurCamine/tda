name: Companion
on:
  pull_request:
  push:
    branches: [main, Preview]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - os: ubuntu-latest
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
      - run: uv venv --python 3.12.14
      - run: uv pip install -c local-companion/requirements-test.lock -e ./local-companion[test]
      - run: ${{ matrix.python }} -m pytest local-companion/tests -q
      - run: uv build local-companion --wheel --out-dir wheelhouse
      - name: Installation plan safety check
        shell: pwsh
        run: ./local-companion/packaging/plan.ps1 -InstallRoot '${{ runner.temp }}/tda-app' -DataRoot '${{ runner.temp }}/tda-data'

  windows-app:
    name: windows-installer (TDACompanion-x64.msi)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
      - run: uv venv --python 3.12.14
      - run: uv pip install -c local-companion/requirements-test.lock -e ./local-companion[test,packaging,desktop]
      - name: Validate PowerShell harness syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "local-companion/packaging/install-rc-runtimes.ps1",
            "local-companion/packaging/run-physical-acceptance.ps1",
            "local-companion/packaging/run-installed-acceptance.ps1",
            "local-companion/packaging/smoke-windows-lifecycle.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "POWERSHELL_HARNESS_INVALID"
            }
          }
      - name: Install WiX Toolset 5
        shell: pwsh
        run: dotnet tool install --tool-path .wix wix --version 5.0.2
      - name: Build Windows bundle and MSI
        shell: pwsh
        run: ./local-companion/packaging/build-windows.ps1
      - name: Smoke packaged executable
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-bundle.ps1 -PackageRoot "local-companion/out/windows/TDACompanion-$version"
      - name: Smoke MSI install and uninstall
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-msi.ps1 -MsiPath "local-companion/out/windows/TDACompanion-x64.msi" -Version $version
      - name: Smoke rollback, real upgrade, preserve uninstall and purge
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-lifecycle.ps1 `
            -CurrentMsiPath "local-companion/out/windows/TDACompanion-x64.msi" `
            -RollbackProbeMsiPath "local-companion/out/windows/TDACompanion-rollback-probe-x64.msi" `
            -CurrentVersion $version
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: TDACompanion-windows-x64
          path: |
            local-companion/out/windows/TDACompanion-x64.msi
            local-companion/out/windows/TDACompanion-x64.msi.sha256
            local-companion/out/windows/TDACompanion-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
