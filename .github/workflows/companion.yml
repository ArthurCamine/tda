name: Companion
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact repository source SHA to validate and package
        required: false
        type: string
  workflow_dispatch:
permissions:
  contents: read
env:
  TDA_SOURCE_SHA: ${{ github.event_name == 'workflow_call' && inputs.source_sha || github.sha }}
jobs:
  synthetic:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - os: ubuntu-latest
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TDA_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TDA_SOURCE_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
      - run: uv venv --python 3.12.14
      - run: uv pip install -c local-companion/requirements-test.lock -e ./local-companion[test]
      - run: ${{ matrix.python }} local-companion/packaging/verify_dependency_lock.py local-companion/requirements-test.lock
      - run: ${{ matrix.python }} -m pytest local-companion/tests -q
      - run: uv build local-companion --wheel --out-dir wheelhouse
      - name: Installation plan safety check
        shell: pwsh
        run: ./local-companion/packaging/plan.ps1 -InstallRoot '${{ runner.temp }}/tda-app' -DataRoot '${{ runner.temp }}/tda-data'

  windows-app:
    name: windows-installer (TDACompanion-x64.msi)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TDA_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:TDA_SOURCE_SHA.ToLowerInvariant()) { throw "BUILD_SOURCE_SHA_MISMATCH:$actual" }
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'
      - run: uv venv --python 3.12.14
      - run: uv pip install -c local-companion/requirements-test.lock -e ./local-companion[test,packaging,desktop]
      - run: .venv/Scripts/python.exe local-companion/packaging/verify_dependency_lock.py local-companion/requirements-test.lock --require-all
      - name: Validate PowerShell harness syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "local-companion/packaging/plan.ps1",
            "local-companion/packaging/install-rc-runtimes.ps1",
            "local-companion/packaging/run-physical-acceptance.ps1",
            "local-companion/packaging/run-installed-acceptance.ps1",
            "local-companion/packaging/smoke-windows-lifecycle.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "POWERSHELL_HARNESS_INVALID"
            }
          }
      - name: Install WiX Toolset 5
        shell: pwsh
        run: dotnet tool install --tool-path .wix wix --version 5.0.2
      - name: Build Windows bundle and MSI
        shell: pwsh
        run: ./local-companion/packaging/build-windows.ps1
      - name: Generate exact payload evidence
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim().ToLowerInvariant()
          .venv/Scripts/python.exe -m tda_companion.payload_evidence `
            --app-root "local-companion/out/windows/TDACompanion-$version/app" `
            --version $version `
            --source-sha $env:TDA_SOURCE_SHA `
            --source-tree-sha $tree `
            --output "local-companion/out/windows/TDACompanion-payload-manifest.json"
      - name: Smoke packaged executable
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-bundle.ps1 -PackageRoot "local-companion/out/windows/TDACompanion-$version"
      - name: Smoke MSI install and uninstall
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-msi.ps1 -MsiPath "local-companion/out/windows/TDACompanion-x64.msi" -Version $version
      - name: Smoke rollback, real upgrade, preserve uninstall and purge
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tda_companion; print(tda_companion.VERSION)").Trim()
          ./local-companion/packaging/smoke-windows-lifecycle.ps1 `
            -CurrentMsiPath "local-companion/out/windows/TDACompanion-x64.msi" `
            -RollbackProbeMsiPath "local-companion/out/windows/TDACompanion-rollback-probe-x64.msi" `
            -CurrentVersion $version
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TDACompanion-windows-x64
          path: |
            local-companion/out/windows/TDACompanion-x64.msi
            local-companion/out/windows/TDACompanion-x64.msi.sha256
            local-companion/out/windows/TDACompanion-payload-manifest.json
            local-companion/out/windows/TDACompanion-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 90
