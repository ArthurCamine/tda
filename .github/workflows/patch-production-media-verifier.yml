name: Patch Production Media Verifier

on:
  push:
    branches:
      - fix/media-public-verification-cd-v2
    paths:
      - .github/workflows/patch-production-media-verifier.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/media-public-verification-cd-v2
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Patch Production CD media boundary
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('.github/workflows/production.yml')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'\n      - name: Pull Production media credentials\n.*?\n      - name: Build Production artifact\n', re.S)
          replacement = "\n".join([
              "",
              "      - name: Verify immutable public media",
              "        id: media",
              "        shell: bash",
              "        run: |",
              "          set -euo pipefail",
              "          node tools/media/verify-public.mjs \\",
              "            --receipt .local/media-production-verification-receipt.json",
              "          node --input-type=module - <<'NODE'",
              "          import fs from \"node:fs\";",
              "          const receipt = JSON.parse(fs.readFileSync(\".local/media-production-verification-receipt.json\", \"utf8\"));",
              "          const summary = receipt.summary;",
              "          if (summary.assets !== summary.verified) {",
              "            throw new Error(`Media verification incomplete: ${summary.verified}/${summary.assets}`);",
              "          }",
              "          const output = process.env.GITHUB_OUTPUT;",
              "          fs.appendFileSync(output, `assets=${summary.assets}\\n`);",
              "          fs.appendFileSync(output, `verified=${summary.verified}\\n`);",
              "          fs.appendFileSync(output, `manifest_set=${receipt.manifestSetSha256}\\n`);",
              "          NODE",
              "",
              "      - name: Build Production artifact",
              "",
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('failed to replace Production media publish block')
          anchor = '          vercel curl /sessoes --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null\n'
          addition = anchor + '          vercel curl /lore/yllith --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null\n          vercel curl /lore/yllith/historia.md --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null\n'
          if anchor not in text:
              raise SystemExit('failed to find staged smoke anchor')
          text = text.replace(anchor, addition, 1)
          text = re.sub(r'^          MEDIA_(?:PUBLISHED|REUSED): .*\n', '', text, count=2, flags=re.M)
          old_receipt = '          - Immutable media: $MEDIA_VERIFIED/$MEDIA_ASSETS verified (published=$MEDIA_PUBLISHED, reused=$MEDIA_REUSED)\n'
          if old_receipt not in text:
              raise SystemExit('failed to find Production receipt media line')
          text = text.replace(old_receipt, '          - Immutable media: $MEDIA_VERIFIED/$MEDIA_ASSETS public assets verified\n', 1)
          text = text.replace('          - Staged smoke: PASS\n', '          - Staged smoke: PASS\n          - Yllith standalone staged smoke: PASS\n', 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify media tooling
        run: node --test tools/media/verify-public.test.mjs

      - name: Verify repository checks
        run: pnpm check

      - name: Commit Production CD boundary
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-production-media-verifier.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/production.yml .github/workflows/patch-production-media-verifier.yml
          git commit -m "fix(cd): verify public media in Production"
          git push origin HEAD:fix/media-public-verification-cd-v2
