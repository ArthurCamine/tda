name: Runtime Promote Stable

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Immutable runtime RC tag to promote
        required: true
        type: string
      confirmation:
        description: Type PROMOTE to authorize the final channel switch
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: verify physical receipt and promote exact runtime RC bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Stable runtime promotion must be dispatched from main"; exit 1; }
          [[ "$CONFIRMATION" == "PROMOTE" ]] || { echo "::error::confirmation must be exactly PROMOTE"; exit 1; }
          [[ "$RC_TAG" =~ ^companion-(whisper|qwen)-runtime-rc-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]{12}$ ]] || { echo "::error::Invalid runtime RC tag shape"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact physical acceptance receipt for this RC
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT_PATH="docs/companion/runtime-acceptance/${RC_TAG}.json"
          [[ -f "$RECEIPT_PATH" ]] || { echo "::error::Missing runtime physical acceptance receipt at $RECEIPT_PATH"; exit 1; }
          echo "path=$RECEIPT_PATH" >> "$GITHUB_OUTPUT"

      - name: Require active prerelease RC
        id: release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,tagName,isDraft,isPrerelease,targetCommitish > rc-release.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          value = json.load(open('rc-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['RC_TAG'] or value.get('isDraft') is not False or value.get('isPrerelease') is not True:
              raise SystemExit('RC_RELEASE_STATE_INVALID')
          release_id = value.get('databaseId')
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit('RC_RELEASE_ID_INVALID')
          print('release_id=' + str(release_id))
          PY

      - name: Download RC assets without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-assets
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir rc-assets
          test -f rc-assets/TDARuntime-candidate.json

      - name: Verify candidate bytes and physical receipt
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared
          cp "${{ steps.receipt.outputs.path }}" prepared/TDARuntime-acceptance.json
          STABLE_TAG="$(PYTHONPATH=local-companion python -m tda_companion.runtime_release_evidence verify-promotion \
            --candidate-manifest rc-assets/TDARuntime-candidate.json \
            --acceptance-receipt prepared/TDARuntime-acceptance.json \
            --assets-root rc-assets \
            --output prepared/TDARuntime-promotion.json)"
          [[ "$STABLE_TAG" =~ ^companion-(whisper|qwen)-runtime-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          value = json.load(open('prepared/TDARuntime-promotion.json', encoding='utf-8'))
          if value['candidate_tag'] != os.environ['RC_TAG']:
              raise SystemExit('RC_EVIDENCE_TAG_MISMATCH')
          print('stable_tag=' + value['stable_tag'])
          print('family=' + value['family'])
          print('version=' + value['version'])
          print('source_sha=' + value['source_sha'])
          print('source_tree_sha=' + value['source_tree_sha'])
          print('runtime_archive_sha256=' + value['runtime_archive_sha256'])
          PY

      - name: Require current main to contain identical runtime and release content
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          if ! git diff --quiet "$SOURCE_SHA" HEAD -- \
            local-companion \
            .github/workflows/runtime-rc.yml \
            .github/workflows/runtime-promote.yml \
            .github/workflows/whisper-runtime.yml \
            .github/workflows/qwen-runtime-package.yml \
            .github/workflows/qwen-runtime-release.yml; then
            echo "::error::Runtime or release workflow content differs from the physically tested source; create a new RC"
            git diff --name-only "$SOURCE_SHA" HEAD -- local-companion .github/workflows/runtime*.yml .github/workflows/*runtime*.yml || true
            exit 1
          fi

      - name: Verify RC tag and release target resolve to tested source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          git fetch --force origin "refs/tags/$RC_TAG:refs/tags/$RC_TAG"
          [[ "$(git rev-list -n 1 "$RC_TAG")" == "$SOURCE_SHA" ]] || { echo "::error::RC tag target mismatch"; exit 1; }
          TARGET="$(python -c "import json; print(json.load(open('rc-release.json')).get('targetCommitish') or '')")"
          [[ "$TARGET" == "$SOURCE_SHA" ]] || { echo "::error::RC release target mismatch"; exit 1; }

      - name: Require stable identity to be unused
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          ! gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "::error::Stable runtime release already exists"; exit 1; }
          ! git ls-remote --exit-code --tags origin "refs/tags/$STABLE_TAG" >/dev/null 2>&1 || { echo "::error::Stable runtime tag already exists"; exit 1; }

      - name: Attach audit evidence idempotently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-current
          for NAME in TDARuntime-acceptance.json TDARuntime-promotion.json; do
            if gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir evidence-current >/dev/null 2>&1; then
              cmp -s "evidence-current/$NAME" "prepared/$NAME" || { echo "::error::Existing RC evidence $NAME differs"; exit 1; }
            else
              gh release upload "$RC_TAG" --repo "$GITHUB_REPOSITORY" "prepared/$NAME"
            fi
          done

      - name: Re-download evidence before channel switch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence-check && mkdir evidence-check
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'TDARuntime-acceptance.json' --pattern 'TDARuntime-promotion.json' --dir evidence-check
          cmp -s evidence-check/TDARuntime-acceptance.json prepared/TDARuntime-acceptance.json
          cmp -s evidence-check/TDARuntime-promotion.json prepared/TDARuntime-promotion.json

      - name: Promote the same release object and runtime assets to stable
        shell: bash
        run: |
          set -euo pipefail
          STABLE_TAG="${{ steps.evidence.outputs.stable_tag }}"
          FAMILY="${{ steps.evidence.outputs.family }}"
          VERSION="${{ steps.evidence.outputs.version }}"
          SOURCE_SHA="${{ steps.evidence.outputs.source_sha }}"
          RECEIPT_SHA="$(sha256sum prepared/TDARuntime-acceptance.json | awk '{print $1}')"
          cat > stable-notes.md <<EOF
          Runtime oficial do TDA Companion para ${FAMILY} no Windows x64.

          Promoção do candidato físico ${RC_TAG}; assets não foram recompilados nem reenviados.

          - Source SHA testado: ${SOURCE_SHA}
          - Source tree SHA: ${{ steps.evidence.outputs.source_tree_sha }}
          - Runtime archive SHA-256: ${{ steps.evidence.outputs.runtime_archive_sha256 }}
          - Physical acceptance receipt SHA-256: ${RECEIPT_SHA}
          EOF
          gh release edit "$RC_TAG" --repo "$GITHUB_REPOSITORY" --tag "$STABLE_TAG" --target "$SOURCE_SHA" \
            --title "TDA ${FAMILY} Runtime v${VERSION}" --notes-file stable-notes.md --prerelease=false

      - name: Verify stable postconditions from fresh downloads
        shell: bash
        env:
          STABLE_TAG: ${{ steps.evidence.outputs.stable_tag }}
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,tagName,isDraft,isPrerelease,targetCommitish > stable-release.json
          python - <<'PY'
          import json, os
          value = json.load(open('stable-release.json', encoding='utf-8'))
          if value.get('tagName') != os.environ['STABLE_TAG'] or value.get('isDraft') is not False or value.get('isPrerelease') is not False:
              raise SystemExit('STABLE_RELEASE_STATE_INVALID')
          if value.get('targetCommitish') != os.environ['SOURCE_SHA']:
              raise SystemExit('STABLE_RELEASE_TARGET_MISMATCH')
          if str(value.get('databaseId')) != os.environ['EXPECTED_RELEASE_ID']:
              raise SystemExit('STABLE_RELEASE_OBJECT_CHANGED')
          PY
          rm -rf stable-check && mkdir stable-check
          gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --dir stable-check
          PYTHONPATH=local-companion python -m tda_companion.runtime_release_evidence verify-promotion \
            --candidate-manifest stable-check/TDARuntime-candidate.json \
            --acceptance-receipt stable-check/TDARuntime-acceptance.json \
            --assets-root stable-check \
            --output stable-check/post-promotion.json >/dev/null
          cmp -s stable-check/TDARuntime-promotion.json stable-check/post-promotion.json
          git fetch --force origin "refs/tags/$STABLE_TAG:refs/tags/$STABLE_TAG"
          [[ "$(git rev-list -n 1 "$STABLE_TAG")" == "$SOURCE_SHA" ]] || { echo "::error::Stable runtime tag target mismatch"; exit 1; }
          echo "RUNTIME_STABLE_PROMOTION_VERIFIED tag=$STABLE_TAG source=$SOURCE_SHA release_id=$EXPECTED_RELEASE_ID"
