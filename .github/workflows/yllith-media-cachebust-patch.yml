name: Patch media public verification cache busting

on:
  push:
    branches:
      - media/yllith-canonical-14-cutover

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: media/yllith-canonical-14-cutover

      - name: Apply deterministic patch and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path('tools/media/pipeline.mjs')
          text = pipeline.read_text()
          needle = '''async function verifyPublicDelivery(asset, attempts = 8) {\n\tlet lastError;\n\tfor (let attempt = 1; attempt <= attempts; attempt += 1) {\n\t\ttry {\n\t\t\tconst response = await fetch(asset.publicUrl, {'''
          replacement = '''export function publicVerificationUrl(publicUrl, attempt, now = Date.now()) {\n\tconst url = new URL(publicUrl);\n\turl.searchParams.set("tda_verify", `${now}-${attempt}`);\n\treturn url;\n}\n\nasync function verifyPublicDelivery(asset, attempts = 8) {\n\tlet lastError;\n\tfor (let attempt = 1; attempt <= attempts; attempt += 1) {\n\t\ttry {\n\t\t\tconst response = await fetch(publicVerificationUrl(asset.publicUrl, attempt), {'''
          if text.count(needle) != 1:
              raise SystemExit('pipeline patch anchor missing or ambiguous')
          pipeline.write_text(text.replace(needle, replacement))

          test_file = Path('tools/media/pipeline.test.mjs')
          tests = test_file.read_text()
          import_needle = '''\tpublishAll,\n\treadAssetBytes,'''
          if import_needle not in tests:
              raise SystemExit('test import anchor missing')
          tests = tests.replace(import_needle, '''\tpublishAll,\n\tpublicVerificationUrl,\n\treadAssetBytes,''', 1)
          regression = '''\n\ntest("public verification cache-busts readback without changing the canonical asset URL", () => {\n\tconst canonical = "https://media.dnd.faysk.dev/lore/yllith/abc/image.webp";\n\tconst first = publicVerificationUrl(canonical, 1, 123456);\n\tconst second = publicVerificationUrl(canonical, 2, 123456);\n\tassert.equal(first.origin + first.pathname, canonical);\n\tassert.equal(second.origin + second.pathname, canonical);\n\tassert.equal(first.searchParams.get("tda_verify"), "123456-1");\n\tassert.equal(second.searchParams.get("tda_verify"), "123456-2");\n\tassert.notEqual(first.href, second.href);\n});\n'''
          if 'public verification cache-busts readback' in tests:
              raise SystemExit('regression test already present')
          test_file.write_text(tests + regression)
          PY

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate patch
        run: |
          node --test tools/media/pipeline.test.mjs
          pnpm media:validate

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/media/pipeline.mjs tools/media/pipeline.test.mjs
          git rm .github/workflows/yllith-media-cachebust-patch.yml
          git commit -m "fix(media): bypass stale negative cache during public verification"
          git push origin HEAD:media/yllith-canonical-14-cutover
