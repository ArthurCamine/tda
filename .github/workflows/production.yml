name: Production CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit to redeploy
        required: false
        type: string

permissions:
  contents: write
  deployments: write
  pull-requests: read

concurrency:
  group: tda-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_9wuTfarCQ3L63xtufPKUDzi0
  VERCEL_PROJECT_ID: prj_hDiDvvRiesg3qCDekGWE8JQMkIyH
  VERCEL_CLI_VERSION: 59.23.2
  SUPABASE_PROJECT_REF: dmrqnbdvbkfqzctcerbx
  SUPABASE_CLI_VERSION: 2.117.0
  TDA_MIGRATION_BOUNDARY: 20260906210333
  R2_PUBLIC_BUCKET: tda-media-public
  PRODUCTION_ORIGIN: https://dnd.faysk.dev

jobs:
  release:
    name: staged-release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://dnd.faysk.dev
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      REQUESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve exact current main source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          SOURCE_SHA="${REQUESTED_SHA:-$CURRENT_SHA}"
          if [[ "$SOURCE_SHA" != "$CURRENT_SHA" ]]; then
            echo "::error::Refusing stale/arbitrary Production release. Requested ${SOURCE_SHA}, current main is ${CURRENT_SHA}."
            exit 1
          fi
          git checkout --detach "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "release=prod-${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Require merged pull request into main
        id: provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/pulls" > source-prs.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const sha = process.env.SOURCE_SHA;
          const prs = JSON.parse(fs.readFileSync("source-prs.json", "utf8"));
          const match = prs.find((pr) =>
            pr.merged_at && pr.base?.ref === "main" && pr.merge_commit_sha === sha
          );
          if (!match) {
            throw new Error(`Production source ${sha} is not the merge result of a pull request into main`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `pr=${match.number}\n`);
          console.log(`PRODUCTION_SOURCE_OK PR #${match.number} -> main ${sha}`);
          NODE

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Resolve current canonical Production baseline
        id: baseline
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "$PRODUCTION_ORIGIN/api/version" > current-production-version.json
          BASE_SHA="$(node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const version = JSON.parse(fs.readFileSync("current-production-version.json", "utf8"));
          if (typeof version.commit !== "string" || !/^[a-f0-9]{40}$/.test(version.commit)) {
            throw new Error(`Canonical Production returned invalid commit identity: ${version.commit ?? "<missing>"}`);
          }
          process.stdout.write(version.commit);
          NODE
          )"
          git cat-file -e "${BASE_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"; then
            echo "::error::Canonical Production SHA $BASE_SHA is not an ancestor of release SHA $SOURCE_SHA."
            exit 1
          fi
          RANGE="${BASE_SHA}..${SOURCE_SHA}"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "Production baseline: $BASE_SHA"
          echo "Release range: $RANGE"

      - name: Plan conditional Production work
        id: plan
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_RANGE: ${{ steps.baseline.outputs.range }}
        run: |
          set -euo pipefail
          CURRENT_PARENT="$(git rev-parse "${SOURCE_SHA}^1")"
          CURRENT_RANGE="${CURRENT_PARENT}..${SOURCE_SHA}"
          echo "current_range=$CURRENT_RANGE" >> "$GITHUB_OUTPUT"
          node tools/ci/production-release-plan.mjs "$RELEASE_RANGE" "$CURRENT_RANGE"

      - name: Validate only required release credentials
        shell: bash
        env:
          MIGRATIONS_REQUIRED: ${{ steps.plan.outputs.migrations }}
          MEDIA_PUBLISH_REQUIRED: ${{ steps.plan.outputs.media_publish }}
        run: |
          set -euo pipefail
          [[ -n "${VERCEL_TOKEN:-}" ]] || { echo "::error::Missing production secret VERCEL_TOKEN"; exit 1; }

          if [[ "$MIGRATIONS_REQUIRED" == "true" ]]; then
            [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo "::error::Missing SUPABASE_ACCESS_TOKEN for migration release"; exit 1; }
            [[ -n "${SUPABASE_DB_PASSWORD:-}" ]] || { echo "::error::Missing SUPABASE_DB_PASSWORD for migration release"; exit 1; }
            [[ "$SUPABASE_ACCESS_TOKEN" == sbp_* ]] || { echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase personal access token"; exit 1; }
          fi

          if [[ "$MEDIA_PUBLISH_REQUIRED" == "true" ]]; then
            [[ -n "${R2_ACCOUNT_ID:-}" ]] || { echo "::error::Missing R2_ACCOUNT_ID for media release"; exit 1; }
            [[ -n "${R2_ACCESS_KEY_ID:-}" ]] || { echo "::error::Missing R2_ACCESS_KEY_ID for media release"; exit 1; }
            [[ -n "${R2_SECRET_ACCESS_KEY:-}" ]] || { echo "::error::Missing R2_SECRET_ACCESS_KEY for media release"; exit 1; }
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production artifact
        env:
          APP_ENV: production
          APP_COMMIT_SHA: ${{ steps.source.outputs.sha }}
          TDA_RELEASE_ID: ${{ steps.source.outputs.release }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Start staged Production artifact without domain traffic
        id: stage
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_ID: ${{ steps.source.outputs.release }}
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prebuilt --prod --skip-domain --yes --no-wait --token="$VERCEL_TOKEN" \
            --env APP_ENV=production \
            --env APP_COMMIT_SHA="$SOURCE_SHA" \
            --env TDA_RELEASE_ID="$RELEASE_ID" | tail -n 1)"
          if [[ ! "$URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel did not return a valid staged Production URL: $URL"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Staged Production deployment started: $URL"

      - name: Wait for staged Production readiness
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel inspect "$DEPLOYMENT_URL" --wait --timeout=20m --token="$VERCEL_TOKEN"

      - name: Install pinned Supabase CLI when migrations changed
        if: ${{ steps.plan.outputs.migrations == 'true' }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Validate migration policy
        if: ${{ steps.plan.outputs.migrations == 'true' }}
        run: node tools/ci/check-migrations.mjs

      - name: Apply and verify Production migrations
        if: ${{ steps.plan.outputs.migrations == 'true' }}
        run: bash tools/ci/apply-production-migrations.sh

      - name: Publish and read back changed canonical media
        if: ${{ steps.plan.outputs.media_publish == 'true' }}
        env:
          MEDIA_RANGE: ${{ steps.plan.outputs.current_range }}
        run: bash tools/ci/publish-production-media.sh "$MEDIA_RANGE"

      - name: Smoke staged Production artifact
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_ID: ${{ steps.source.outputs.release }}
        run: |
          set -euo pipefail
          vercel curl /api/health --deployment "$DEPLOYMENT_URL" > health.json
          vercel curl /api/version --deployment "$DEPLOYMENT_URL" > version.json
          vercel curl / --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null
          vercel curl /sessoes --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null
          vercel curl /lore/yllith --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null
          vercel curl /lore --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null
          vercel curl /lore/astel --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null
          vercel curl /lore/noah --deployment "$DEPLOYMENT_URL" --fail --silent --show-error --output /dev/null
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
          const version = JSON.parse(fs.readFileSync("version.json", "utf8"));
          if (health.ok !== true) throw new Error("Staged Production health is not ok");
          if (health.environment !== "production") throw new Error(`Expected production environment, got ${health.environment}`);
          if (health.commit !== process.env.SOURCE_SHA) throw new Error(`Health commit mismatch: ${health.commit}`);
          if (version.commit !== process.env.SOURCE_SHA) throw new Error(`Version commit mismatch: ${version.commit}`);
          if (version.release !== process.env.RELEASE_ID) throw new Error(`Release id mismatch: ${version.release}`);
          NODE

      - name: Promote the tested artifact
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --timeout=5m --token="$VERCEL_TOKEN"

      - name: Verify canonical Production after promotion
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_ID: ${{ steps.source.outputs.release }}
        run: |
          set -euo pipefail
          node tools/ci/verify-production-canonical.mjs
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            --output /dev/null "$PRODUCTION_ORIGIN/"

      - name: Record tiny release receipt
        shell: bash
        env:
          RELEASE_ID: ${{ steps.source.outputs.release }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          PR_NUMBER: ${{ steps.provenance.outputs.pr }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          MIGRATIONS: ${{ steps.plan.outputs.migrations }}
          MEDIA: ${{ steps.plan.outputs.media_publish }}
        run: |
          set -euo pipefail
          cat > release-receipt.md <<EOF
          Production release generated by TDA CI/CD.

          - Previous canonical SHA: \`$BASE_SHA\`
          - Source SHA: \`$SOURCE_SHA\`
          - Pull request: #$PR_NUMBER -> main
          - Release: \`$RELEASE_ID\`
          - Staged/tested deployment: $DEPLOYMENT_URL
          - Canonical production: $PRODUCTION_ORIGIN
          - Migrations applied: \`$MIGRATIONS\`
          - Changed media publication lifecycle: \`$MEDIA\`
          - Staged + canonical smoke: PASS
          EOF

          if gh release view "$RELEASE_ID" >/dev/null 2>&1; then
            gh release edit "$RELEASE_ID" --target "$SOURCE_SHA" --title "$RELEASE_ID" --notes-file release-receipt.md
          else
            gh release create "$RELEASE_ID" --target "$SOURCE_SHA" --title "$RELEASE_ID" --notes-file release-receipt.md
          fi
          cat release-receipt.md >> "$GITHUB_STEP_SUMMARY"
