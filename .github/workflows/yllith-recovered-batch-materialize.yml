name: Materialize recovered Yllith media batch

on:
  push:
    branches:
      - media/yllith-recovered-batch-1

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: media/yllith-recovered-batch-1

      - name: Download validated recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: yllith-canonical-media
          path: .recovery/yllith
          github-token: ${{ github.token }}
          run-id: 34830061388

      - name: Materialize canonical sources and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media/sources/yllith media/manifests
          cp .recovery/yllith/maos_sobre_mapa_matilha.webp.base64 media/sources/yllith/maos_sobre_mapa_matilha.webp.base64
          cp .recovery/yllith/sonho_paralax_backgroud.avif.base64 media/sources/yllith/sonho_paralax_backgroud.avif.base64
          cp .recovery/yllith/sonho_paralax_espirito.webp.base64 media/sources/yllith/sonho_paralax_espirito.webp.base64
          cat > media/manifests/yllith-recovered-batch-1.json <<'JSON'
          {
            "schemaVersion": 1,
            "project": "yllith-recovered-batch-1",
            "namespace": "lore/yllith",
            "bucket": "tda-media-public",
            "publicOrigin": "https://media.dnd.faysk.dev",
            "assets": [
              {
                "file": "maos_sobre_mapa_matilha.webp",
                "source": "media/sources/yllith/maos_sobre_mapa_matilha.webp.base64",
                "encoding": "base64",
                "bytes": 20272,
                "sha256": "4f76223c2b0b4065beb6457173bf8a3a684715c7fcf76a395ccc7e252c0734d4",
                "contentType": "image/webp"
              },
              {
                "file": "sonho_paralax_backgroud.avif",
                "source": "media/sources/yllith/sonho_paralax_backgroud.avif.base64",
                "encoding": "base64",
                "bytes": 16786,
                "sha256": "bcf5985f7f43bb50e40d36fc40a6e35192343cf39d9159a479ad0a62f3bab655",
                "contentType": "image/avif"
              },
              {
                "file": "sonho_paralax_espirito.webp",
                "source": "media/sources/yllith/sonho_paralax_espirito.webp.base64",
                "encoding": "base64",
                "bytes": 18090,
                "sha256": "52dcd41179659ff80bb0b55bab50862a4d4449d726a5dd3a0b50af5db02800fd",
                "contentType": "image/webp"
              }
            ]
          }
          JSON
          rm -rf .recovery

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate media manifest
        run: pnpm media:validate

      - name: Commit materialized batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/sources/yllith media/manifests/yllith-recovered-batch-1.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "media(yllith): version recovered canonical batch"
          git push origin HEAD:media/yllith-recovered-batch-1
