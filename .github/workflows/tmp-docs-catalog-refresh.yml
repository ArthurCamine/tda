name: Temporary docs catalog refresh

on:
  push:
    branches: [docs/media-storage-contract]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/media-storage-contract
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Regenerate catalog and self-remove
        shell: bash
        run: |
          set -euo pipefail
          pnpm docs:generate
          git rm .github/workflows/tmp-docs-catalog-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation/catalog.md
          git commit -m "docs: refresh generated catalog"
          git push origin HEAD:docs/media-storage-contract
