[project]
name = "tda-companion"
version = "0.3.12"
description = "Per-user local processing supervisor for TDA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "psutil==7.2.2",
    "nvidia-ml-py==13.610.43",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]
packaging = ["pyinstaller==6.22.3"]
desktop = [
    "pywebview==6.2.1",
    "pystray==0.19.5",
    "pillow==12.3.0",
]
# ASR remains isolated from the HTTP Agent; engine runtimes are packaged separately.
asr = ["faster-whisper==1.2.1", "ctranslate2==4.8.2"]

[project.scripts]
tda-companion = "tda_companion.__main__:main"
tda-companion-windows = "tda_companion.windows_app:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tda_companion*"]

[tool.setuptools.package-data]
tda_companion = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]